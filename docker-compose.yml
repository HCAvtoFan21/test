version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:latest
    container_name: elou-avt-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: elou-avt
    volumes:
      - mongodb_data:/data/db
    networks:
      - elou-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: elou-avt-api
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://root:password@mongodb:27017/elou-avt
      PORT: 5000
      JWT_SECRET: your_jwt_secret_key_change_in_production
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - elou-network
    restart: unless-stopped

  # Python Backend
  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: elou-avt-python
    ports:
      - "5001:5001"
    environment:
      MONGODB_URI: mongodb://root:password@mongodb:27017/elou-avt
      PYTHON_PORT: 5001
      API_SERVER: http://api:5000
      FLASK_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - elou-network
    restart: unless-stopped

  # Frontend (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: elou-avt-frontend
    ports:
      - "80:80"
    depends_on:
      - api
      - python
    networks:
      - elou-network
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local

networks:
  elou-network:
    driver: bridge
